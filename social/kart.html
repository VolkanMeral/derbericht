<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fafaf8; }
  .k { width: 1080px; height: 1350px; box-sizing: border-box; padding: 64px 72px 60px; display: flex; flex-direction: column;
       font-family: 'Geist', Arial, sans-serif; color: #111113; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -0.04em; }
  .logo span { color: #c8321c; }
  .meta { display: flex; align-items: center; gap: 16px; font-size: 24px; color: #6b6b72; }
  .cat { background: #c8321c; color: #fff; font-weight: 600; padding: 7px 18px; border-radius: 999px; }
  .fig { position: relative; margin-top: 40px; flex: 1 1 auto; min-height: 420px; border-radius: 32px; overflow: hidden; background: #ecebe6; }
  .fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ki { position: absolute; left: 20px; bottom: 20px; font-size: 20px; background: rgba(17,17,19,.75); color: #fff; padding: 6px 16px; border-radius: 999px; }
  h1 { margin: 40px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 1.04; letter-spacing: -0.03em; }
  .src { margin-top: 20px; font-size: 26px; color: #55555c; }
  .src b { color: #111113; font-weight: 600; }
  .bottom { margin-top: 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 28px; border-top: 2px solid #e8e7e3; }
  .laender { display: flex; align-items: center; gap: 26px; }
  .land { display: flex; align-items: center; gap: 10px; font-size: 32px; }
  .land svg { border-radius: 3px; }
  .n { font-size: 26px; color: #55555c; }
  .n b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; color: #111113; }
  .cta { font-size: 26px; font-weight: 600; color: #c8321c; white-space: nowrap; }
</style>
</head>
<body>
<div class="k">
  <div class="top">
    <div class="logo">Der Bericht<span>.</span></div>
    <div class="meta"><span class="cat">{{kategorie}}</span><span>{{zeit}}</span></div>
  </div>
  <div class="fig"><img src="{{bild}}" alt=""><span class="ki">KI-Illustration</span></div>
  <h1 id="t">{{titel}}</h1>
  <div class="src">{{label}}: <b>{{quelle}}</b>{{auch}}</div>
  <div class="bottom">
    <div class="laender">{{laender}}<span class="n"><b>{{anzahl}}</b> Redaktionen</span></div>
    <div class="cta">derbericht.com →</div>
  </div>
</div>
<script>
  // The picture takes the free space; a very long headline gets smaller type so the picture keeps 420px.
  window.fit = function () {
    const k = document.querySelector('.k'), t = document.getElementById('t');
    let size = 64;
    while (k.scrollHeight > 1350 && size > 42) { size -= 2; t.style.fontSize = size + 'px'; }
  };
</script>
</body>
</html>
