# Manually started: checks the candidate feeds in scripts/feed_candidates.txt and stores the
# result as feed_check.json in the "feed-check" branch.
name: Feed-Check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/feed_check.py scripts/feed_candidates.txt
      - run: python scripts/terms_check.py scripts/terms_sites.txt
      - name: Save to branch
        run: |
          mkdir out && mv feed_check.json terms_check.json out/ && cd out
          git init -q -b feed-check
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "feed check $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" feed-check
