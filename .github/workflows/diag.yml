# Manual check: site status, AI illustrations, and live Worker errors (results appear as annotations)
name: Diagnose
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Worker-Fehler mitschneiden
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (npx wrangler tail --format json > tail.log 2>tail.err &) ; sleep 20
          for p in / /api/social.json /at; do curl -s -o /dev/null -w "$p %{http_code}\n" "https://derbericht.com$p?t=$(date +%s)"; done
          sleep 8; pkill -f "wrangler tail" || true
          python3 - <<'PY'
          import json
          for line in open("tail.log", encoding="utf-8", errors="replace"):
              pass
          raw = open("tail.log", encoding="utf-8", errors="replace").read()
          dec = json.JSONDecoder(); i = 0; n = 0
          while i < len(raw):
              while i < len(raw) and raw[i] in " \n\r\t": i += 1
              if i >= len(raw): break
              try:
                  ev, i = dec.raw_decode(raw, i)
              except ValueError:
                  break
              for ex in ev.get("exceptions", []):
                  n += 1; print(f"::error::{ex.get('name')}: {ex.get('message')}"[:900])
              for lg in ev.get("logs", []):
                  if lg.get("level") in ("error", "warn"):
                      n += 1; print(f"::warning::{' '.join(map(str, lg.get('message', [])))}"[:900])
          print(f"::notice::{n} Fehlermeldungen")
          PY
          head -c 600 tail.err | tr '\n' ' ' | sed 's/^/::notice::tail: /'; echo
      - run: python3 scripts/diag.py
