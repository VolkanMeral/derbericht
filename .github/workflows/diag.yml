# Manual check: which current stories have an AI illustration (results appear as annotations)
name: Diagnose
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://derbericht.com/api/social.json?min=3&img=0&hours=12&t=$(date +%s)" | python3 -c '
          import json, sys, time
          for s in json.load(sys.stdin)["stories"]:
              age = (time.time() * 1000 - s["first_seen"]) / 3.6e6
              print(f"::notice::{s[\"sources\"]} Quellen | {age:.1f} h | Bild: {\"ja\" if s[\"image\"] else \"nein\"} | {s[\"title\"][:70]}")
          '
