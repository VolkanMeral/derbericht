# Der Bericht – automatische Beiträge auf Facebook, Instagram (und optional Threads).
# Aufbau wie bei havadis-otomasyon. Einrichtung: social/README.md
name: Social Media

on:
  schedule:
    # Alle 30 Minuten; der Bot entscheidet nach Wiener Zeit, welcher der 10 Tagestermine fällig ist
    # (07:30 Briefing · 09/11/14/16/19/21:30 Meldung · 12:30 Nur hier · 17:30 DACH · 20:30 Leser-Stimmung · So 11:00 Woche)
    - cron: "*/30 4-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Testmodus (1 = nichts teilen, nur Bild erzeugen)"
        default: "1"
      sadece_kontrol:
        description: "1 = nur Verbindung zu Facebook/Instagram prüfen"
        default: "0"
      format:
        description: "Format sofort erzeugen: briefing / story / dach / nurhier / stimmung / woche / alle (alle nur mit dry_run=1)"
        default: ""

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  teilen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: social
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      MIN_SOURCES: ${{ vars.MIN_SOURCES || '4' }}
      FORMAT: ${{ github.event_name == 'workflow_dispatch' && inputs.format || '' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS || '8' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: social/requirements.txt

      - run: pip install -r requirements.txt

      - name: Nur Verbindung prüfen
        if: github.event_name == 'workflow_dispatch' && inputs.sadece_kontrol == '1'
        env:
          CHECK_ONLY: "1"
        run: python bot.py

      - name: Gibt es eine neue Geschichte?
        id: kontrol
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.sadece_kontrol == '1') }}
        run: python bot.py --kontrol

      - name: Browser aus dem Cache
        if: steps.kontrol.outputs.neu == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('social/requirements.txt') }}

      - name: Browser installieren
        if: steps.kontrol.outputs.neu == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Bild erzeugen und teilen
        if: steps.kontrol.outputs.neu == 'true'
        run: python bot.py

      - name: Bild und Texte aufbewahren
        if: always() && steps.kontrol.outputs.neu == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beitrag-${{ github.run_number }}
          path: social/cikti/
          if-no-files-found: ignore

      - name: Testbilder in den Branch social-preview legen
        if: always() && env.DRY_RUN == '1' && env.FORMAT != ''
        run: |
          [ -n "$(ls -A cikti 2>/dev/null)" ] || exit 0
          cd cikti
          git init -q -b social-preview
          git config user.name "derbericht-bot"; git config user.email "office@derbericht.com"
          git add -A && git commit -qm "Testbilder $(date -u +%F-%H%M)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" social-preview

      - name: Geteilte Geschichten speichern
        if: always()
        run: |
          git config user.name "derbericht-bot"
          git config user.email "office@derbericht.com"
          git add posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Social: geteilte Geschichten aktualisiert"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -q || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
