name = "derbericht"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "0d1797af93af9eb08da716133d56b1a9"

# Static files (self-hosted fonts) served before the worker.
[assets]
directory = "./public"

# Every 10 minutes: fetch feeds, cluster, generate images, clean up.
[triggers]
crons = ["*/10 * * * *"]

[vars]
SITE_URL = "https://derbericht.com"
SITE_NAME = "Der Bericht"
IMAGE_AI = "on"            # "off" = only category icons
IMAGE_DAILY_LIMIT = "60"   # max AI illustrations per day
IMAGES_PER_RUN = "4"
# Secret (not here): npx wrangler secret put ADMIN_TOKEN

# D1 database: create "derbericht" in the Cloudflare dashboard (Storage & Databases → D1)
# and put its Database ID here. Tables are created automatically on the first run.
[[d1_databases]]
binding = "DB"
database_name = "derbericht"
database_id = "e9cf0f6b-448e-481e-8dd0-c272b5815f3d"

# KI images: enable R2 in the dashboard, create bucket "derbericht-images", then remove the "#" below.
# Without it the site works and shows category icons instead of KI illustrations.
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "derbericht-images"

[ai]
binding = "AI"
